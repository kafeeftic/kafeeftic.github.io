<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Tours | Cosmic Travel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #050510;
            color: #ffffff;
            overflow: hidden; /* Hide scrollbars for the space effect */
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 10;
            background: radial-gradient(circle at center, rgba(26,11,46,0.8) 0%, rgba(5,5,16,1) 100%);
            transition: background 0.5s ease;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 0 0 20px #b24bf3;
            margin-bottom: 20px;
            animation: pulse-glow 3s ease-in-out infinite alternate;
        }

        p {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: #a9a9cc;
            max-width: 600px;
            line-height: 1.5;
            margin-bottom: 40px;
            padding: 0 20px;
        }

        .warp-btn {
            padding: 18px 45px;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            color: #fff;
            background: transparent;
            border: 2px solid #b24bf3;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px #b24bf3 inset, 0 0 15px #b24bf3;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .warp-btn:hover {
            background: #b24bf3;
            box-shadow: 0 0 40px #b24bf3, 0 0 20px #fff inset;
            transform: scale(1.1);
        }

        /* Dynamic Stars */
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            z-index: 1;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes pulse-glow {
            from { text-shadow: 0 0 10px #b24bf3, 0 0 20px #b24bf3, 0 0 30px #8a2be2; }
            to { text-shadow: 0 0 20px #00d2ff, 0 0 30px #00d2ff, 0 0 40px #00ffff; color: #f0f8ff; }
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px #fff; }
        }

        /* Hyperspace active state */
        body.hyperspace-active .container {
            background: transparent;
        }
        
        body.hyperspace-active .star {
            width: 2px !important;
            height: 100px !important;
            background: #00d2ff;
            animation: warp-speed 0.5s linear infinite;
        }

        @keyframes warp-speed {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <h1 id="headline">Nebula Tours</h1>
        <p id="subtext">Book your next weekend getaway to the Andromeda Galaxy. First-class starlight suites available.</p>
        <button class="warp-btn" id="launch-btn">Initiate Hyperdrive</button>
    </div>

    <script>
        // Generate a dynamic 3D-feeling starfield
        function createStars() {
            const starCount = 150;
            for (let i = 0; i < starCount; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                
                // Randomize size, position, and animation timing
                let size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.animationDelay = Math.random() * 5 + 's';
                
                document.body.appendChild(star);
            }
        }

        // Handle the Hyperdrive animation sequence
        document.getElementById('launch-btn').addEventListener('click', function() {
            const btn = this;
            const headline = document.getElementById('headline');
            const subtext = document.getElementById('subtext');
            
            btn.style.display = 'none';
            subtext.style.display = 'none';
            headline.innerText = 'CALCULATING TRAJECTORY...';
            headline.style.animation = 'none';
            headline.style.color = '#ffaa00';
            headline.style.textShadow = '0 0 20px #ffaa00';

            // Phase 1: Prep
            setTimeout(() => {
                headline.innerText = 'HYPERSPACE ENGAGED';
                headline.style.color = '#00d2ff';
                headline.style.textShadow = '0 0 40px #00d2ff';
                document.body.classList.add('hyperspace-active');
            }, 1500);

            // Phase 2: Arrival
            setTimeout(() => {
                document.body.classList.remove('hyperspace-active');
                document.body.style.backgroundColor = '#ffffff';
                headline.style.display = 'none';
                
                // Flash to white, then settle into the destination
                setTimeout(() => {
                    document.body.style.backgroundColor = '#000814';
                    headline.style.display = 'block';
                    headline.innerText = 'WELCOME TO ANDROMEDA';
                    headline.style.color = '#fff';
                    headline.style.textShadow = '0 0 30px #ff007f';
                    subtext.style.display = 'block';
                    subtext.innerText = 'Gravity normal. Temperature 72°F. Enjoy your stay.';
                }, 200);
            }, 4500);
        });

        // Initialize stars on load
        window.onload = createStars;
    </script>
</body>
</html>
